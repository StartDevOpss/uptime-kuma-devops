# ============================================================
# monitoring/grafana/dashboard-configmap.yaml
# ConfigMap com dashboard customizado do Uptime Kuma
# kubectl apply -f monitoring/grafana/dashboard-configmap.yaml
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"   # Label que o sidecar do Grafana usa para auto-import
data:
  uptime-kuma.json: |
    {
      "title": "Uptime Kuma — DevOps Portfolio",
      "uid": "uptime-kuma-devops",
      "tags": ["uptime", "portfolio", "devops"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Status dos Monitors",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "count(monitor_status == 1)",
              "legendFormat": "Online"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Latência média (ms)",
          "type": "timeseries",
          "gridPos": { "x": 6, "y": 0, "w": 18, "h": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "monitor_response_time",
              "legendFormat": "{{ monitor_name }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Uptime 24h (%)",
          "type": "gauge",
          "gridPos": { "x": 0, "y": 4, "w": 6, "h": 4 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "avg(avg_over_time(monitor_status[24h])) * 100",
              "legendFormat": "Uptime"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              }
            }
          }
        }
      ]
    }
